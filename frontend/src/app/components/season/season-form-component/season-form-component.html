<form class="box" (ngSubmit)="createSeason()">
  <label for="seasonName">
    Name
  </label>
    <input
      name="seasonName"
      [(ngModel)]="newSeasonName"
      placeholder="e.g. 2026"
      autocomplete="off"
    />
  <button class="btn btn-primary d-inline-flex align-items-center justify-content-center gap-1 p-2" type="submit">
    <span class="material-symbols-outlined">add</span>
    Create</button>
</form>
