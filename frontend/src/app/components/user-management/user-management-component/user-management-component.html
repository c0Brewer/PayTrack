<div class="main-page-container user-management">
  <div class="d-flex mb-1">
    <h2 class="align-self-start">User Management</h2>
  </div>

  <div class="row g-3 align-items-stretch">
    <app-stat-box-component header="Total Users" [content]="totalUserCount" icon="group" size="small"
      class="col-12 col-sm-6 col-xl-3" />
    <app-stat-box-component header="Active Users" [content]="activeUserPlaceholderCount" icon="check"
      iconColor="#10b981" iconBackgroundColor="#ECFDF5" size="small" class="col-12 col-sm-6 col-xl-3" />
    <app-stat-box-component header="Inactive Users" [content]="inactiveUserPlaceholderCount" icon="person_off"
      iconColor="#6b7280" iconBackgroundColor="#f3f4f6" size="small" class="col-12 col-sm-6 col-xl-3" />
    <app-stat-box-component header="Admins" [content]="adminUserPlaceholderCount" icon="shield" size="small"
      iconColor="#3b82f6" iconBackgroundColor="#EFF6FF" class="col-12 col-sm-6 col-xl-3" />
  </div>
  <app-user-filter-component [limitSelection]="limitSelection" [limit]="limit"
    (updateFilter)="updateFilterOptions($event)" (limitChange)="onLimitChange($event)" />
  <app-user-list-component [user]="user" [activeStatusPendingIds]="activeStatusPendingIds"
    (toggleActive)="toggleActive($event)" (openEditUser)="openEditUser($event)" />
  <app-pagination-component [hasNext]="hasNext" [hasPrev]="hasPrev" [currentPage]="page" [maxPage]="getTotalPages()"
    (next)="nextPage()" (prev)="previousPage()"></app-pagination-component>
</div>
@if (editingUser) {
<app-modal-component title="Edit User" (closeEvent)="closeEdit()">
  <form class="d-flex flex-column gap-3">
    <label class="d-flex flex-column gap-1">
      <span class="fw-semibold">Name</span>
      <input class="form-control" [(ngModel)]="editingUser.name" name="name" />
    </label>

    <label class="d-flex flex-column gap-1">
      <span class="fw-semibold">Role</span>
      <select class="form-select" [(ngModel)]="editingUser.role" name="role">
        @for (role of roleOptions; track role.value) {
        <option [ngValue]="role.value">{{ role.text }}</option>
        }
      </select>
    </label>

    <label class="d-flex flex-column gap-1">
      <span class="fw-semibold">Team</span>
      <select class="form-select" [(ngModel)]="editingUser.team!.id" name="team">
        <option [ngValue]="-1">No Team</option>
        @for (team of teams; track team.id) {
        <option [ngValue]="team.id">{{ team.name }}</option>
        }
      </select>
    </label>

    <div class="d-flex align-items-center justify-content-between gap-3 rounded border px-3 py-2">
      <label class="fw-semibold" for="edit-user-active">Active</label>
      <div class="form-check form-switch d-flex align-items-center m-0 p-0">
        <input id="edit-user-active" class="form-check-input float-none m-0" [checked]="editingUser.isActive"
          (change)="editingUser.isActive = $any($event.target).checked" name="isActive" role="switch" type="checkbox" />
      </div>
    </div>

    <div class="row g-2 justify-content-sm-end pt-1">
      <div class="col-12 col-sm-auto order-2 order-sm-1">
        <button type="button" class="btn btn-secondary w-100" (click)="closeEdit()">
          Cancel
        </button>
      </div>
      <div class="col-12 col-sm-auto order-1 order-sm-2">
        <button type="button" class="btn btn-primary w-100" (click)="saveUser(editingUser)">
          Save
        </button>
      </div>
    </div>
  </form>
</app-modal-component>
}
