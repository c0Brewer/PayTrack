<div class="user-filter row g-3 m-0 p-3 rounded-2">
  <div class="col-12 col-md-6 col-xl">
    <input
      class="form-control"
      type="text"
      placeholder="Filter by name..."
      (input)="onNameFilterChange($event)"
    />
  </div>

  <div class="col-12 col-md-6 col-xl">
    <input
      class="form-control"
      type="text"
      placeholder="Filter by email..."
      (input)="onEmailFilterChange($event)"
    />
  </div>

  <div class="col-12 col-md-6 col-xl">
    <select class="form-select" (change)="onRoleFilterChange($event)">
      <option value="">All Roles</option>
      <option [value]="0">Regular User</option>
      <option [value]="1">Team Lead</option>
      <option [value]="2">Admin</option>
    </select>
  </div>

  <div class="col-12 col-md-6 col-xl-auto">
    <select class="form-select" [(ngModel)]="limit" (change)="onLimitChange()">
      @for (l of limitSelection; track l) {
        <option [value]="l">{{ l }} per page</option>
      }
    </select>
  </div>

  <div class="col-12 col-md-6 col-xl-auto">
    <select
      class="form-select"
      [(ngModel)]="filterIsActive"
      (ngModelChange)="onIsActiveFilterChange()"
    >
      <option [ngValue]="undefined">All</option>
      <option [ngValue]="true">Only Active</option>
      <option [ngValue]="false">Only Inactive</option>
    </select>
  </div>
</div>
