<table class="team-table">
  <colgroup>
    <col style="width: 18%" />
    <col style="width: 22%" />
    <col style="width: 23%" />
    <col style="width: 30%" />
    <col style="width: 7%" />
  </colgroup>

  <thead>
    <tr>
      <th>Name</th>
      <th>Description</th>
      <th>Member Count</th>
      <th>Status</th>
      <th class="actions-col">Actions</th>
    </tr>
  </thead>

  <tbody>
    @for (team of teams; track team.id) {
      <tr>
        <td class="name">
          <a
            [routerLink]="[team.id]"
            class="team-name-badge"
            [style.background]="getDisplayColor(team)"
            [style.color]="getTeamNameTextColor(team)"
          >
            {{ team.name }}
          </a>
        </td>

        <td class="description">{{ getDescription(team) }}</td>
        <td>{{ getMembersCount(team) }}</td>
        <td>
          <span class="status-badge" [class.active]="team.isActive">
            {{ team.isActive ? 'Active' : 'Inactive' }}
          </span>
        </td>
        <td class="actions-col">
          <button class="edit-btn" (click)="onOpenEditTeam(team)">Edit</button>
        </td>
      </tr>
    } @empty {
      <tr>
        <td [attr.colspan]="getVisibleColumnCount()">No teams found.</td>
      </tr>
    }
  </tbody>
</table>
