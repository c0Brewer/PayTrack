<table class="team-table TUR-table">
  <thead>
    <tr>
      <th class="name-col">Name</th>
      <th class="description-col">Description</th>
      <th class="members-col">Member Count</th>
      <th class="status-col">Status</th>
      <th class="actions-col">Actions</th>
    </tr>
  </thead>

  <tbody>
    @for (team of teams; track team.id) {
      <tr>
        <td class="name name-col" data-label="Name">
          <span
            class="table-badge team-name-badge"
            [style.--table-badge-source-color]="getDisplayColor(team)"
          >
            {{ team.name }}
          </span>
        </td>

        <td class="description description-col" data-label="Description">
          {{ getDescription(team) }}
        </td>
        <td class="members-col" data-label="Member Count">{{ getMembersCount(team) }}</td>

        <td class="status-col" data-label="Status">
          <button
            type="button"
            class="status-btn"
            [class.active]="team.isActive"
            [class.inactive]="!team.isActive"
            [disabled]="isActiveStatusPending(team)"
            (click)="onToggleActive(team)"
            [title]="team.isActive ? 'Click to deactivate user' : 'Click to activate team'"
          >
            <span class="status-dot" aria-hidden="true"></span>
            {{ team.isActive ? 'Active' : 'Inactive' }}
          </button>
        </td>
        <td class="actions-col" data-label="Actions">
          <div class="action-buttons">
            <a class="btn btn-secondary icon-hover-btn" [routerLink]="['/team', team.id]">
              <span class="material-symbols-outlined">bar_chart</span>
              <span class="btn-text">Details</span>
            </a>
            <button
              type="button"
              class="btn btn-secondary icon-hover-btn"
              (click)="onOpenEditTeam(team)"
            >
              <span class="material-symbols-outlined">edit</span>
              <span class="btn-text">Edit</span>
            </button>
          </div>
        </td>
      </tr>
    } @empty {
      <tr>
        <td [attr.colspan]="getVisibleColumnCount()">No teams found.</td>
      </tr>
    }
  </tbody>
</table>
