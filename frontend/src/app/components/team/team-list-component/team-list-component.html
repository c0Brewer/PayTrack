<table class="team-table">
  <colgroup>
    <col style="width: 20%" />
    <col />
    <col style="width: 15%" />
    <col style="width: 15%" />
    <col style="width: 10%" />
  </colgroup>

  <thead>
    <tr>
      <th>Name</th>
      <th>Description</th>
      <th>Members</th>
      <th>Target Amount</th>
      <th class="actions-col">Actions</th>
    </tr>
  </thead>

  <tbody>
    @for (team of teams; track team.id) {
      <tr>
        <td class="name">
          <span
            class="team-name-badge"
            [style.background]="getDisplayColor(team)"
            [style.color]="getTeamNameTextColor(team)"
          >
            {{ team.name }}
          </span>
        </td>

        <td class="description">{{ getDescription(team) }}</td>
        <td>{{ getMembersCount(team) }}</td>
        <td>
          {{
            getBudgetTargetAmount(team) !== null
              ? `${getBudgetTargetAmount(team)} €`
              : 'No target amount'
          }}
        </td>

        <td class="actions-col">
          <button class="edit-btn" (click)="onOpenEditTeam(team)">Edit</button>
        </td>
      </tr>
    } @empty {
      <tr>
        <td [attr.colspan]="getVisibleColumnCount()">No teams found.</td>
      </tr>
    }
  </tbody>
</table>
