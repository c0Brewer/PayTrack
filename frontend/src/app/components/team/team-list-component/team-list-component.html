<table class="team-table">
  <colgroup>
    <col style="width: 20%" />
    <col style="width: 30%" />
    <col style="width: 15%" />
    <col style="width: 12.5%" />
    <col style="width: 12.5%" />
    <col style="width: 10%" />
  </colgroup>

  <thead>
    <tr>
      <th>Name</th>
      <th>Description</th>
      <th>Color</th>
      <th>Members</th>
      <th>Budgets</th>
      <th class="actions-col">Actions</th>
    </tr>
  </thead>

  <tbody>
    @for (team of teams; track team.id) {
      <tr>
        <td class="name">{{ team.name }}</td>

        <td class="description">{{ getDescription(team) }}</td>

        <td class="color-cell">
          <div class="team">
            <span class="team-color" [style.background]="team.displayColor?.trim() || '#9ca3af'"></span>
          </div>
        </td>

        <td>{{ getMembersCount(team) }}</td>

        <td>{{ getBudgetsCount(team) }}</td>

        <td class="actions-col">
          <button class="edit-btn" (click)="onOpenEditTeam(team)">Edit</button>
        </td>
      </tr>
    } @empty {
      <tr>
        <td colspan="6">No teams found.</td>
      </tr>
    }
  </tbody>
</table>
