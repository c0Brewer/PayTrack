<app-modal-component
  title="Edit Team"
  info="Update Team Information and Color"
  (closeEvent)="onClose()"
>
  @if (team.id < 0) {
    <span>Team not found.</span>
  } @else {
    <label>
      Name
      <input [(ngModel)]="team.name"/>
    </label>

    <label>
      Description
      <input [(ngModel)]="team.description"/>
    </label>

    <label>
      Color
      <div class="color-picker">
        <input
          type="color"
          [ngModel]="selectedColor"
          (ngModelChange)="setDisplayColor($event)"
          aria-label="Choose team color"
        />
        <span class="color-value">{{ selectedColor }}</span>
      </div>
    </label>

    <div class="team-preview">
      <span class="team-preview__label">Preview</span>
      <span class="team-preview__badge" [style.background]="selectedColor">
        {{ team.name || 'Team name' }}
      </span>
    </div>

    <div class="modal-actions">
      <button (click)="onClose()">Cancel</button>
      <button (click)="onSave()">Save</button>
    </div>
  }
</app-modal-component>
