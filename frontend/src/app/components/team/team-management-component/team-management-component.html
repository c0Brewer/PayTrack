<div class="main-page-container team-management">
  <div class="d-flex flex-column flex-sm-row align-items-sm-center justify-content-sm-between gap-3 mb-4">
    <div class="d-flex flex-column gap-1">
      <h1 class="m-0">Team Management</h1>
      <p class="mb-0 text-body-secondary">
        Create teams, adjust assignments, and keep team structures up to date.
      </p>
    </div>
    <button
      type="button"
      class="btn btn-primary align-self-start align-self-sm-auto d-inline-flex align-items-center gap-1"
      (click)="openCreate()"
    >
      <span class="material-symbols-outlined">add</span>
      Create
    </button>
  </div>

  <div class="row g-3 align-items-stretch">
    <app-stat-box-component
      header="Total Teams"
      [content]="totalTeamCount"
      icon="group"
      size="small"
      class="col-12 col-sm-6 col-xl-3"
    />
    <app-stat-box-component
      header="Free Data slot"
      [content]="10"
      icon="group"
      iconColor="#3b82f6"
      iconBackgroundColor="#EFF6FF"
      size="small"
      class="col-12 col-sm-6 col-xl-3"
    />
    <app-stat-box-component
      header="Total Budget"
      [content]="'€1000'"
      icon="trending_up"
      iconColor="#10b981"
      iconBackgroundColor="#ECFDF5"
      size="small"
      class="col-12 col-sm-6 col-xl-3"
    />
    <app-stat-box-component
      header="Teams With Budget"
      [content]="10"
      icon="trending_up"
      size="small"
      class="col-12 col-sm-6 col-xl-3"
    />
  </div>

  <app-team-filter-component
    [limitSelection]="limitSelection"
    [limit]="limit"
    (updateFilter)="updateFilterOptions($event)"
    (limitChange)="onLimitChange($event)"
  ></app-team-filter-component>

  <app-team-list-component
    [teams]="teams"
    [activeStatusPendingIds]="activeStatusPendingIds"
    [costCentres]="costCentres"
    (toggleActive)="toggleActive($event)"
    (openEditTeam)="openEditTeam($event)"
  ></app-team-list-component>

  <app-pagination-component
    [hasNext]="hasNext"
    [hasPrev]="hasPrev"
    [currentPage]="page"
    [maxPage]="getTotalPages()"
    (next)="nextPage()"
    (prev)="previousPage()"
  ></app-pagination-component>

  @if (editingTeam) {
    <app-team-edit-modal-component
      [team]="editingTeam"
      [costCentres]="costCentres"
      [seasons]="seasons"
      (saveEvent)="saveTeam($event)"
      (deleteEvent)="openDeleteTeam($event)"
      (closeEvent)="closeEdit()"
    ></app-team-edit-modal-component>
  }

  @if (deletingTeam && deleteImpact) {
    <app-team-delete-impact-modal-component
      [impact]="deleteImpact"
      [isTeamActive]="deletingTeam.isActive !== false"
      (confirmDelete)="confirmDelete()"
      (closeEvent)="closeDelete()"
    ></app-team-delete-impact-modal-component>
  }
</div>
