<div class="toolbar">
  <input type="text" placeholder="Filter by name..." (input)="onNameFilterChange($event)" />
  <input
    type="text"
    placeholder="Filter by description..."
    (input)="onDescriptionFilterChange($event)"
  />

  <input
    type="number"
    min="0"
    placeholder="Min budget..."
    (input)="onMinBudgetFilterChange($event)"
  />

  <input
    type="number"
    min="0"
    placeholder="Max budget..."
    (input)="onMaxBudgetFilterChange($event)"
  />

  <select [(ngModel)]="limit" (change)="onLimitChange()">
    @for (l of limitSelection; track l) {
      <option [value]="l">{{ l }} per page</option>
    }
  </select>

  <select [(ngModel)]="filterIncludeMembers" (ngModelChange)="onIncludeMembersFilterChange()">
    <option [ngValue]="undefined">Members: default</option>
    <option [ngValue]="true">Include members</option>
    <option [ngValue]="false">Hide members</option>
  </select>

  <select [(ngModel)]="filterIncludeBudgets" (ngModelChange)="onIncludeBudgetsFilterChange()">
    <option [ngValue]="undefined">Budgets: default</option>
    <option [ngValue]="true">Include budgets</option>
    <option [ngValue]="false">Hide budgets</option>
  </select>
</div>
