<div class="toolbar">
  <input type="text" placeholder="Name..." (input)="onNameFilterChange($event)" />
  <input
    type="text"
    placeholder="Description..."
    (input)="onDescriptionFilterChange($event)"
  />

  <input
    type="number"
    min="0"
    placeholder="Min budget..."
    (input)="onMinBudgetFilterChange($event)"
  />

  <input
    type="number"
    min="0"
    placeholder="Max budget..."
    (input)="onMaxBudgetFilterChange($event)"
  />

  <select [(ngModel)]="limit" (change)="onLimitChange()">
    @for (l of limitSelection; track l) {
      <option [value]="l">{{ l }} per page</option>
    }
  </select>

  <label>
    <input
      type="checkbox"
      [(ngModel)]="filterIncludeMembers"
      (ngModelChange)="onIncludeMembersFilterChange()"
    />
    Include members
  </label>

  <label>
    <input
      type="checkbox"
      [(ngModel)]="filterIncludeBudgets"
      (ngModelChange)="onIncludeBudgetsFilterChange()"
    />
    Include budgets
  </label>
</div>
