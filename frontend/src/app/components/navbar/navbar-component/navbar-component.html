@let loggedIn = loggedIn$ | async;
@let user = currentUser$ | async;

@if (loggedIn) {
  <nav class="navbar-container">
    <div class="user-info">
      <span>User: <strong>{{ user?.name }}</strong></span>
    </div>

    <div class="nav-actions">
      <button (click)="logout()" class="logout-btn">Logout</button>
      <a routerLink="/usersettings" class="nav-link">Settings</a>
    </div>
  </nav>
}
