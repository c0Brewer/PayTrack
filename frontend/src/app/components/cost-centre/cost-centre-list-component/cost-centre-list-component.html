<table class="cost-centre-table" style="width: 100%"> <colgroup>
    <col style="width: 15%" />
    <col style="width: 30%" />
    <col style="width: 30%" />
    <col style="width: 25%" />
  </colgroup>

  <thead>
    <tr>
      <th>Name</th>
      <th>Description</th>
      <th>Budgets</th>
      <th class="actions-col">Actions</th>
    </tr>
  </thead>

  <tbody>
    @for (c of costCentres; track c.id) {
      <tr>
        <td class="name">{{ c.name }}</td>

        <td class="description">{{ c.description }}</td>

        <td>
          @if (c.budgets && c.budgets.length > 0) {
            <span class="has-budgets">Placeholder, has budgets</span>
          } @else {
            <span class="no-budgets">no budgets</span>
          }
        </td>

        <td class="actions-col">
          <button class="edit-btn" (click)="onOpenEdit(c)">Edit</button>
          <button class="delete-btn" (click)="onOpenDelete(c)">Delete</button>
        </td>
      </tr>
    }
  </tbody>
</table>
