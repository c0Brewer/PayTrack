<div class="toolbar cost-centre-filter">
  <div class="d-flex align-items-center gap-2 mb-4">
    <span class="filter-icon material-symbols-outlined" aria-hidden="true">filter_alt</span>
    <h5 class="m-0">Filter</h5>
  </div>

  <div class="row g-3">
    <div class="col-12 col-md-6 col-xl">
      <input
        class="form-control"
        type="text"
        placeholder="Name..."
        (input)="onNameFilterChange($event)"
      />
    </div>

    <div class="col-12 col-md-6 col-xl">
      <input
        class="form-control"
        type="text"
        placeholder="Description..."
        (input)="onDescriptionFilterChange($event)"
      />
    </div>

    <div class="col-12 col-md-6 col-xl">
      <input
        class="form-control"
        type="number"
        placeholder="Min budget..."
        min="0"
        (input)="onMinBudgetFilterChange($event)"
      />
    </div>

    <div class="col-12 col-md-6 col-xl">
      <input
        class="form-control"
        type="number"
        placeholder="Max budget..."
        min="0"
        (input)="onMaxBudgetFilterChange($event)"
      />
    </div>

    <div class="col-12 col-md-6 col-xl-auto">
      <select class="form-select" [(ngModel)]="limit" (change)="onLimitChange()">
        @for (l of limitSelection; track l) {
          <option [value]="l">{{ l }} per page</option>
        }
      </select>
    </div>
  </div>
</div>
