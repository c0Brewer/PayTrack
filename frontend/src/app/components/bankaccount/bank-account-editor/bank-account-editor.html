<app-modal-component [title]="title" (closeEvent)="cancel.emit()">
  @if (topLevelErrorMessage) {
    <p class="error-message">{{ topLevelErrorMessage }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <label>
      Account Holder
      <input type="text" formControlName="accountHolder" maxlength="255" autocomplete="off" />
      @if (form.controls.accountHolder.touched && form.controls.accountHolder.invalid) {
        <small class="hint-error">Use 3-255 characters.</small>
      }
    </label>

    <label>
      IBAN
      <input
        type="text"
        formControlName="iban"
        maxlength="42"
        autocomplete="off"
        placeholder="AT61 1904 3002 3457 3201"
        (input)="onIbanInput($event)"
      />
      @if (ibanErrorMessage) {
        <small class="hint-error">{{ ibanErrorMessage }}</small>
      }
    </label>

    <label>
      BIC
      <input
        type="text"
        formControlName="bic"
        autocomplete="off"
        maxlength="11"
        placeholder="BKAUATWW"
      />
      @if (form.controls.bic.touched && form.controls.bic.invalid) {
        <small class="hint-error">Use 8-11 characters.</small>
      }
    </label>

    <div class="actions">
      <button type="button" class="btn btn-secondary d-inline-flex align-items-center gap-1" (click)="cancel.emit()"><span class="material-symbols-outlined">cancel</span> Cancel</button>
      <button type="submit" class="btn btn-primary d-inline-flex align-items-center gap-1"><span class="material-symbols-outlined">save</span> {{ submitLabel }}</button>
    </div>
  </form>
</app-modal-component>
