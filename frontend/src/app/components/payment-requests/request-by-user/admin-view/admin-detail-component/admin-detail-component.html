<app-admin-invoice-detail-component
  [invoice]="invoice"
  [showUserName]="true"
  [receiptBlobUrl]="receiptBlobUrl"
  [isReceiptImage]="isReceiptImage"
  [hasReceipt]="!!rawReceiptBlobUrl"
  [loading]="loading"
  [canManageStatus]="true"
  [canMarkPaid]="true"
  [markingPaid]="markingPaid"
  [statusActionPending]="statusActionPending"
  [budgets]="budgets"
  (downloadReceipt)="onDownloadReceipt()"
  (approve)="onApprove($event)"
  (decline)="onDecline($event)"
  (requestChanges)="onRequestChanges($event)"
  (markPaid)="onMarkPaid($event)"
  (back)="onBack()"
/>

@if (canUndoLastStatusChange) {
  <div class="undo-status-action">
    <button
      type="button"
      class="btn btn-secondary"
      [disabled]="undoingStatusChange"
      (click)="onUndoStatusChange()"
    >
      <span class="material-symbols-outlined">undo</span>
      {{ undoingStatusChange ? 'Undoing...' : 'Undo last status change' }}
    </button>
  </div>
}

@if (modalType) {
  <app-external-notification-component
    [type]="modalType"
    [recipientEmail]="notificationEmail"
    [defaultSubject]="notificationSubject"
    [defaultMessage]="notificationMessage"
    (sentEvent)="onNotificationSent()"
    (closeEvent)="onNotificationModalClosed()"
  />
}
