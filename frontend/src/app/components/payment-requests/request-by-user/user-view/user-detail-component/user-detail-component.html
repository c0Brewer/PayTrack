@if (canEditRequestedChanges) {
  <div
    class="alert alert-warning d-flex flex-column flex-md-row align-items-start align-items-md-center justify-content-between gap-3 shadow-sm rounded-4 p-4"
    role="alert"
  >
    <div class="d-flex align-items-start gap-3">
    <span class="material-symbols-outlined fs-2 text-warning-emphasis" aria-hidden="true">
      notification_important
    </span>

      <div>
        <h4 class="alert-heading mb-1 text-dark">
          Changes Requested
        </h4>

        <p class="mb-0">
          Reason: {{ latestChangeRequestMessage }}
        </p>
      </div>
    </div>
    <button
      type="button"
      class="btn btn-primary d-inline-flex align-items-center justify-content-center gap-2 fw-semibold px-4 py-2 text-nowrap shadow-sm align-self-stretch align-self-md-center"
      (click)="onEdit()"
    >
      <span class="material-symbols-outlined" aria-hidden="true">edit</span>
      Revise and Resubmit
    </button>
  </div>
}

<app-user-invoice-detail-component
  [invoice]="invoice"
  [showUserName]="false"
  [receiptBlobUrl]="receiptBlobUrl"
  [isReceiptImage]="isReceiptImage"
  [hasReceipt]="!!rawReceiptBlobUrl"
  [loading]="loading"
  (downloadReceipt)="onDownloadReceipt()"
  (back)="onBack()"
/>
