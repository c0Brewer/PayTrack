<div class="team-requests">
  <div class="d-flex flex-column flex-sm-row align-items-sm-center justify-content-sm-between gap-3 w-100 mb-4">
    <h2 class="m-0">Payment Requests</h2>
    <button class="btn btn-primary align-self-start align-self-sm-auto" (click)="navigateBankStatementUpload()">
      Upload Bank Statement
    </button>
  </div>

  <app-team-request-admin-filter-component
    [limitSelection]="limitSelection"
    [limit]="limit"
    (updateFilter)="updateFilterOptions($event)"
    (limitChange)="onUpdateLimit($event)"
  ></app-team-request-admin-filter-component>

  <app-team-request-list-component
    [requests]="requests"
    [showUserColumn]="true"
    (openDetail)="onOpenDetail($event)"
  ></app-team-request-list-component>

  <app-pagination-component
    [hasNext]="hasNext"
    [hasPrev]="hasPrev"
    [currentPage]="page"
    [maxPage]="getTotalPages()"
    (next)="nextPage()"
    (prev)="previousPage()"
  ></app-pagination-component>
</div>
