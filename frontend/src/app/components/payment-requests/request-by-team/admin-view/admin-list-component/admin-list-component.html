<div class="team-requests">
  <div class="list-header">
    <h2>Payment Requests by Team</h2>

    <div class="export-actions">
      <button type="button" [disabled]="isExporting" (click)="exportFinancialData('Csv')">
        Export CSV
      </button>
      <button type="button" [disabled]="isExporting" (click)="exportFinancialData('Pdf')">
        Export PDF
      </button>
    </div>
  </div>

  <app-team-request-filter-component
    [limitSelection]="limitSelection"
    [limit]="limit"
    [showCostCentreFilter]="true"
    [showUserFilter]="true"
    (updateFilter)="updateFilterOptions($event)"
    (limitChange)="onUpdateLimit($event)"
  ></app-team-request-filter-component>

  <app-team-request-list-component
    [requests]="requests"
    [showUserColumn]="true"
    (openDetail)="onOpenDetail($event)"
  ></app-team-request-list-component>

  <app-pagination-component
    [hasNext]="hasNext"
    [hasPrev]="hasPrev"
    [currentPage]="page"
    [maxPage]="getTotalPages()"
    (next)="nextPage()"
    (prev)="previousPage()"
  ></app-pagination-component>
</div>
