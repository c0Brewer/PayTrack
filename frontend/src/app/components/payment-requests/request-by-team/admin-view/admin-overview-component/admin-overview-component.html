<div class="main-page-container team-requests">
  <div class="d-flex flex-column flex-sm-row align-items-sm-center justify-content-sm-between gap-3 w-100 mb-1">
    <h2 class="m-0">Payment Requests</h2>
    <button class="btn btn-primary align-self-start align-self-sm-auto d-inline-flex align-items-center gap-1" (click)="navigateBankStatementUpload()">
      <span class="material-symbols-outlined">upload</span>
      Upload Bank Statement
    </button>
  </div>

  <div class="row g-3 align-items-stretch">
    <app-stat-box-component
      header="Total Requests"
      [content]="totalCount"
      icon="docs"
      size="small"
      class="col-12 col-sm-6 col-xl-3"
    />
    <app-stat-box-component
      header="Total Amount"
      [content]="getTotalAmount() | euro"
      icon="trending_up"
      iconColor="#3b82f6"
      iconBackgroundColor="#EFF6FF"
      size="small"
      class="col-12 col-sm-6 col-xl-3"
    />
    <app-stat-box-component
      header="Submitted"
      [content]="getSubmittedRequestCount()"
      icon="send"
      iconColor="#F59E0B"
      iconBackgroundColor="#FFFBEB"
      size="small"
      class="col-12 col-sm-6 col-xl-3"
    />
    <app-stat-box-component
      header="Paid"
      [content]="getPaidRequestCount()"
      icon="paid"
      iconColor="#10b981"
      iconBackgroundColor="#ECFDF5"
      size="small"
      class="col-12 col-sm-6 col-xl-3"
    />
  </div>

  <app-team-request-admin-filter-component
    [limitSelection]="limitSelection"
    [limit]="limit"
    (updateFilter)="updateFilterOptions($event)"
    (limitChange)="onUpdateLimit($event)"
  ></app-team-request-admin-filter-component>

  <app-team-request-admin-list-component
    [requests]="requests"
    (openDetail)="onOpenDetail($event)"
  ></app-team-request-admin-list-component>

  <app-pagination-component
    [hasNext]="hasNext"
    [hasPrev]="hasPrev"
    [currentPage]="page"
    [maxPage]="getTotalPages()"
    (next)="nextPage()"
    (prev)="previousPage()"
  ></app-pagination-component>
</div>
