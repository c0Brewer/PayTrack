<div class="my-invoices">
  <h2>Meine Rechnungen</h2>

  <app-invoice-filter-component
    [showCostCentreFilter]="false"
    (updateFilter)="updateFilterOptions($event)"
  ></app-invoice-filter-component>

  <app-invoice-list-component
    [invoices]="invoices"
    [showCostCentreColumn]="false"
    [showUserNameColumn]="false"
    (openDetail)="onOpenDetail($event)"
  ></app-invoice-list-component>

  <app-pagination-component
    [hasNext]="hasNext"
    [hasPrev]="hasPrev"
    [currentPage]="page"
    [maxPage]="getTotalPages()"
    (next)="nextPage()"
    (prev)="previousPage()"
  ></app-pagination-component>
</div>
