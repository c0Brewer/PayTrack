<app-modal-component [title]="title" (closeEvent)="onClose()">
  <p class="recipient-info">
    <span class="material-symbols-outlined recipient-icon" aria-hidden="true">
      {{ type === 'email' ? 'mail' : 'chat' }}
    </span>
    Sending to: <strong>{{ recipientEmail }}</strong>
  </p>

  @if (type === 'email') {
    <label>
      Subject
      <input [(ngModel)]="subject" />
    </label>
  }

  <label>
    Message
    <textarea [(ngModel)]="message" rows="6"></textarea>
  </label>

  <div class="modal-actions">
    <button type="button" class="btn btn-secondary" (click)="onClose()">Cancel</button>
    <button type="button" class="btn btn-primary" [disabled]="sending" (click)="onSend()">
      {{ sending ? 'Sending…' : 'Send' }}
    </button>
  </div>
</app-modal-component>
