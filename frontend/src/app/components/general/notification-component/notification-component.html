<div class="notification-stack">
  @for (n of notifications; track n.id) {
  <div class="notification" [class.notification--error]="n.type === 'error'"
    [class.notification--success]="n.type === 'success'" [class.exiting]="n.exiting" role="alert" aria-live="assertive">
    <!-- Icon -->
    <div class="notification__icon">
      <!-- Error icon: circled exclamation -->
      @if (n.type === 'error') {
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5" />
        <path d="M8 4.5V8.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        <circle cx="8" cy="11" r="0.75" fill="currentColor" />
      </svg>
      }
      <!-- Success icon: circled checkmark -->
      @if (n.type === 'success') {
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5" />
        <path d="M5 8.5L7 10.5L11 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
          stroke-linejoin="round" />
      </svg>
      }
    </div>

    <!-- Message -->
    <p class="notification__message" [class.notification__message--error]="n.type === 'error'"
      [class.notification__message--success]="n.type === 'success'">
      {{ n.message }}
    </p>

    <!-- Dismiss button -->
    <button class="notification__close" (click)="dismiss(n.id)" aria-label="Dismiss notification">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
        <path d="M1 1L11 11M11 1L1 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      </svg>
    </button>

    <!-- Progress bar -->
    <div class="notification__progress">
      <div class="notification__progress-bar" [style.animation-duration.ms]="n.duration"></div>
    </div>
  </div>
  }
</div>
