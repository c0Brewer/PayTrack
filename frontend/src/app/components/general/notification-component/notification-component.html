<div class="notification-stack">
  @for (n of notifications; track n.id) {
    <div
      class="notification"
      [class.notification--error]="n.type === 'error'"
      [class.notification--success]="n.type === 'success'"
      [class.exiting]="n.exiting"
      role="alert"
      aria-live="assertive"
    >
      <div class="notification__icon">
        @if (n.type === 'error') {
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5" />
            <path
              d="M5.75 5.75L10.25 10.25M10.25 5.75L5.75 10.25"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
        }
        @if (n.type === 'success') {
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5" />
            <path
              d="M5 8.5L7 10.5L11 6"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        }
      </div>

      <div class="notification__content">
        <strong class="notification__title">
          {{ n.type === 'success' ? 'Success!' : 'Error!' }}
        </strong>

        <p class="notification__message">
          {{ n.message }}
        </p>
      </div>

      <button class="notification__close" (click)="dismiss(n.id)" aria-label="Dismiss notification">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <path
            d="M1 1L11 11M11 1L1 11"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          />
        </svg>
      </button>

      <div class="notification__progress">
        <div class="notification__progress-bar" [style.animation-duration.ms]="n.duration"></div>
      </div>
    </div>
  }
</div>
