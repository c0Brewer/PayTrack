@if (isLoggingIn) {
  <div class="login-progress-overlay" aria-live="polite" aria-label="Signing in">
    <div class="login-progress-overlay__content">
      <span class="spinner-border" aria-hidden="true"></span>
      <span>Signing In...</span>
    </div>
  </div>
}

<div class="row">
  <section id="left-section-login" class="col-lg-6 order-2 order-lg-1 vh-100 d-flex justify-content-start justify-content-lg-center flex-column">
    <img id="TUR-logo" alt="TU Racing Team Logo Color" src="logos/TUR/TUWRxBMW_Logo_color1.png" width="50%">
    <h1>PayTrack</h1>
    <p>Sign in with your TU Racing Google account</p>
    <button
      type="button"
      class="google-custom-btn"
      data-testid="login-google-button"
      [disabled]="isLoggingIn"
      [attr.aria-busy]="isLoggingIn"
      (click)="signInWithGoogle()"
    >
      @if (isLoggingIn) {
        <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
        <span>Signing In...</span>
      } @else {
        <img src="logos/google/google-icon.jpg" alt="" />
        <span>Login Via Google</span>
      }
    </button>
    <div class="divider-with-text">
      <span>Use your &#64;racing.tuwien.ac.at email address</span>
    </div>
    <div id="authorized-notice">
      <span>Only authorized TU Wien Racing members can sign in</span>
    </div>
  </section>
  <section id="right-section-login" class="col-lg-6 order-1 order-lg-2 px-0 background-tur-black vh-100 text-white d-flex justify-content-start justify-content-sm-center align-items-center flex-column">
    <img alt="PayTrack logo" src="logos/paytrack/paytrack-logo-no-padding@0.5x.png" width="20%"/>
    <img id="TUR-logo-mob" alt="TU Racing Team Logo Color" src="logos/TUR/TUWRxBMW_Logo_white_blue.png" >
    <h1 id="mobile-text">PayTrack</h1>
    <h1>Welcome to PayTrack</h1>
    <p>Simplified invoice management for TU Wien Racing</p>
  </section>
</div>
