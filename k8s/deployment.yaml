apiVersion: v1
kind: ConfigMap
metadata:
  name: paytrack-config
  namespace: __NAMESPACE__
data:
  ASPNETCORE_ENVIRONMENT: Production
  CORS__Origins: https://__HOST__
  Migrations__Auto: "true"
  POSTGRES_HOST: paytrack-postgres
  POSTGRES_PORT: "5432"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paytrack-postgres
  namespace: __NAMESPACE__
spec:
  selector:
    matchLabels:
      app: paytrack-postgres
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: paytrack-postgres
    spec:
      securityContext:
        fsGroup: 1001
      containers:
        - name: postgres
          image: __POSTGRES_IMAGE__
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: paytrack-secrets
                  key: POSTGRES_DB
            - name: POSTGRESQL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: paytrack-secrets
                  key: POSTGRES_USER
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paytrack-secrets
                  key: POSTGRES_PASSWORD
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
              ephemeral-storage: "100Mi"
            limits:
              memory: "512Mi"
              cpu: "500m"
              ephemeral-storage: "300Mi"
          volumeMounts:
            - name: postgres-config
              mountPath: /opt/bitnami/postgresql/conf
            - name: postgres-data
              mountPath: /bitnami/postgresql
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-config
          emptyDir: {}
        - name: postgres-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: paytrack-postgres
  namespace: __NAMESPACE__
spec:
  selector:
    app: paytrack-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paytrack-backend
  namespace: __NAMESPACE__
spec:
  selector:
    matchLabels:
      app: paytrack-backend
  replicas: 1
  template:
    metadata:
      labels:
        app: paytrack-backend
    spec:
      imagePullSecrets:
        - name: secret-dockercfg
      containers:
        - name: backend
          image: __BACKEND_IMAGE__
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: paytrack-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: CORS__Origins
              valueFrom:
                configMapKeyRef:
                  name: paytrack-config
                  key: CORS__Origins
            - name: Migrations__Auto
              valueFrom:
                configMapKeyRef:
                  name: paytrack-config
                  key: Migrations__Auto
            - name: ConnectionStrings__Default
              valueFrom:
                secretKeyRef:
                  name: paytrack-secrets
                  key: ConnectionStrings__Default
            - name: JWT__Secret
              valueFrom:
                secretKeyRef:
                  name: paytrack-secrets
                  key: JWT__Secret
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: paytrack-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: paytrack-secrets
                  key: GOOGLE_CLIENT_SECRET
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
              ephemeral-storage: "100Mi"
            limits:
              memory: "512Mi"
              cpu: "500m"
              ephemeral-storage: "250Mi"
          startupProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          lifecycle:
            preStop:
              httpGet:
                path: /health/prepareShutdown
                port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: paytrack-backend
  namespace: __NAMESPACE__
spec:
  selector:
    app: paytrack-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paytrack
  namespace: __NAMESPACE__
spec:
  rules:
    - host: __HOST__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: paytrack-backend
                port:
                  number: 8080
