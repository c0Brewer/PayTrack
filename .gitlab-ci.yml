stages:
  - install
  - lint
  - build
  - test
  - package
  - deploy

# Shared pipeline variables
variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  NODE_ENV: "ci"
  GIT_STRATEGY: clone
  K8S_NAMESPACE: "26ss-ase-pr-qse-08"
  K8S_HOST: "26ss-ase-pr-qse-08.apps.student.inso-w.at"
  GOOGLE_CLIENT_ID: "727777231080-l2rd54f5cm1jjaiscnke940co92u0tsf.apps.googleusercontent.com"
  BACKEND_IMAGE: "$CI_REGISTRY_IMAGE/backend"
  POSTGRES_IMAGE: "postgres:16-alpine"

default:
  interruptible: true

# Frontend dependency installation
frontend_install:
  stage: install
  image: node:20
  rules:
    - changes:
        - .gitlab-ci.yml
        - frontend/**/*
        - k8s/**/*
  script:
    - cd frontend
    - npm ci
  artifacts:
    paths:
      - frontend/node_modules
    expire_in: 1h

# Backend restore
backend_restore:
  stage: install
  image: mcr.microsoft.com/dotnet/sdk:10.0
  rules:
    - changes:
        - .gitlab-ci.yml
        - backend/**/*
        - k8s/**/*
  script:
    - cd backend
    - dotnet restore ./PayTrack/PayTrack.csproj
    - dotnet restore ./PayTrack.Tests/PayTrack.Tests.csproj
  artifacts:
    paths:
      - backend
    expire_in: 1h

# Frontend validation
frontend_lint:
  stage: lint
  image: node:20
  dependencies:
    - frontend_install
  rules:
    - changes:
        - .gitlab-ci.yml
        - frontend/**/*
        - k8s/**/*
  script:
    - cd frontend
    - npm ci
    - npx eslint . --max-warnings=0

# Frontend production build
frontend_build:
  stage: build
  image: node:20
  dependencies:
    - frontend_install
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes:
        - .gitlab-ci.yml
        - frontend/**/*
        - k8s/**/*
  script:
    - cd frontend
    - npm ci
    - npm run build -- --configuration production
  artifacts:
    paths:
      - frontend/dist
    expire_in: 1h

# Backend formatting validation
backend_format:
  stage: lint
  image: mcr.microsoft.com/dotnet/sdk:10.0
  rules:
    - changes:
        - .gitlab-ci.yml
        - backend/**/*
        - k8s/**/*
  dependencies:
    - backend_restore
  script:
    - cd backend
    - dotnet format PayTrack.slnx --verify-no-changes

# Backend release build
backend_build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:10.0
  rules:
    - changes:
        - .gitlab-ci.yml
        - backend/**/*
        - k8s/**/*
  dependencies:
    - backend_restore
  script:
    - cd backend
    - dotnet build PayTrack.slnx --configuration Release -warnaserror
  artifacts:
    paths:
      - backend/bin
      - backend/obj
    expire_in: 1h

# Backend tests with coverage threshold
backend_test:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  rules:
    - changes:
        - .gitlab-ci.yml
        - backend/**/*
        - k8s/**/*
  dependencies:
    - backend_build
  script:
    - cd backend
    - dotnet test /p:CollectCoverage=true /p:CoverletOutputFormat=lcov /p:Threshold=90 /p:ThresholdType=line /p:ThresholdStat=total /p:ExcludeByFile="**/*Migrations/**.cs"

# Frontend tests with coverage report
frontend_test:
  stage: test
  image: mcr.microsoft.com/playwright:v1.58.2-noble
  dependencies:
    - frontend_install
  rules:
    - changes:
        - .gitlab-ci.yml
        - frontend/**/*
        - k8s/**/*
  script:
    - cd frontend
    - npm ci
    - npx playwright install
    - npm run test:coverage
  artifacts:
    when: always
    paths:
      - frontend/coverage

# Build and push backend image to the GitLab registry
package_backend:
  stage: package
  image: mcr.microsoft.com/dotnet/sdk:10.0
  dependencies:
    - frontend_build
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - cd backend
    - mkdir -p ./PayTrack/wwwroot
    - rm -rf ./PayTrack/wwwroot/*
    - cp -r ../frontend/dist/PayTrack/browser/. ./PayTrack/wwwroot/
    - export DOTNET_CONTAINER_REGISTRY_UNAME="$CI_REGISTRY_USER"
    - export DOTNET_CONTAINER_REGISTRY_PWORD="$CI_REGISTRY_PASSWORD"
    - dotnet restore ./PayTrack/PayTrack.csproj
    - dotnet publish ./PayTrack/PayTrack.csproj --configuration Release --no-restore /t:PublishContainer -p:ContainerRegistry=$CI_REGISTRY -p:ContainerRepository="$CI_PROJECT_PATH/backend" -p:ContainerImageTag="$CI_PIPELINE_ID"
    - dotnet publish ./PayTrack/PayTrack.csproj --configuration Release --no-restore /t:PublishContainer -p:ContainerRegistry=$CI_REGISTRY -p:ContainerRepository="$CI_PROJECT_PATH/backend" -p:ContainerImageTag="latest"

# Deploy the current pipeline image into the Kubernetes namespace
deploy_production:
  stage: deploy
  image: bitnami/kubectl:latest
  needs:
    - package_backend
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - test -n "$K8S_NAMESPACE"
    - test -n "$K8S_HOST"
    - kubectl get secret paytrack-secrets --namespace "$K8S_NAMESPACE"
    - sed -e "s|__NAMESPACE__|$K8S_NAMESPACE|g" -e "s|__HOST__|$K8S_HOST|g" -e "s|__BACKEND_IMAGE__|$BACKEND_IMAGE:$CI_PIPELINE_ID|g" -e "s|__POSTGRES_IMAGE__|$POSTGRES_IMAGE|g" k8s/deployment.yaml | kubectl apply -f -
    - kubectl rollout status deployment/paytrack-postgres --namespace "$K8S_NAMESPACE" --timeout=180s
    - kubectl rollout status deployment/paytrack-backend --namespace "$K8S_NAMESPACE" --timeout=180s
