stages:
  - install
  - lint
  - build
  - test
  - package
  - deploy

# Shared pipeline variables
variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"
  NODE_ENV: "ci"
  GIT_STRATEGY: clone
  BACKEND_IMAGE: "$CI_REGISTRY_IMAGE/backend"
  FRONTEND_IMAGE: "$CI_REGISTRY_IMAGE/frontend"
  POSTGRES_IMAGE: "postgres:16-alpine"

default:
  interruptible: true

# Frontend dependency installation
frontend_install:
  stage: install
  image: node:20
  rules:
    - changes:
        - frontend/**/*
  script:
    - cd frontend
    - npm ci
  artifacts:
    paths:
      - frontend/node_modules
    expire_in: 1h

# Backend restore
backend_restore:
  stage: install
  image: mcr.microsoft.com/dotnet/sdk:10.0
  rules:
    - changes:
        - backend/**/*
  script:
    - cd backend
    - dotnet restore ./PayTrack/PayTrack.csproj
    - dotnet restore ./PayTrack.Tests/PayTrack.Tests.csproj
  artifacts:
    paths:
      - backend
    expire_in: 1h

# Frontend validation
frontend_lint:
  stage: lint
  image: node:20
  dependencies:
    - frontend_install
  rules:
    - changes:
        - frontend/**/*
  script:
    - cd frontend
    - npm ci
    - npx eslint . --max-warnings=0

# Frontend production build
frontend_build:
  stage: build
  image: node:20
  dependencies:
    - frontend_install
  rules:
    - changes:
        - frontend/**/*
  script:
    - cd frontend
    - npm ci
    - npm run build -- --configuration production
  artifacts:
    paths:
      - frontend/dist
    expire_in: 1h

# Backend formatting validation
backend_format:
  stage: lint
  image: mcr.microsoft.com/dotnet/sdk:10.0
  rules:
    - changes:
        - backend/**/*
  dependencies:
    - backend_restore
  script:
    - cd backend
    - dotnet format PayTrack.slnx --verify-no-changes

# Backend release build
backend_build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:10.0
  rules:
    - changes:
        - backend/**/*
  dependencies:
    - backend_restore
  script:
    - cd backend
    - dotnet build PayTrack.slnx --configuration Release -warnaserror
  artifacts:
    paths:
      - backend/bin
      - backend/obj
    expire_in: 1h

# Backend tests with coverage threshold
backend_test:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  rules:
    - changes:
        - backend/**/*
  dependencies:
    - backend_build
  script:
    - cd backend
    - dotnet test /p:CollectCoverage=true /p:CoverletOutputFormat=lcov /p:Threshold=90 /p:ThresholdType=line /p:ThresholdStat=total /p:ExcludeByFile="**/*Migrations/**.cs"

# Frontend tests with coverage report
frontend_test:
  stage: test
  image: mcr.microsoft.com/playwright:v1.58.2-noble
  dependencies:
    - frontend_install
  rules:
    - changes:
        - frontend/**/*
  script:
    - cd frontend
    - npm ci
    - npx playwright install
    - npm run test:coverage
  artifacts:
    when: always
    paths:
      - frontend/coverage

# Shared Kaniko setup for container image builds
.kaniko:
  stage: package
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Build and push backend image to the GitLab registry
package_backend:
  extends: .kaniko
  script:
    - /kaniko/executor --context "$CI_PROJECT_DIR/backend" --dockerfile "$CI_PROJECT_DIR/backend/Dockerfile" --destination "$BACKEND_IMAGE:$CI_PIPELINE_ID" --destination "$BACKEND_IMAGE:latest"

# Build and push frontend image to the GitLab registry
package_frontend:
  extends: .kaniko
  script:
    - test -n "$GOOGLE_CLIENT_ID"
    - /kaniko/executor --context "$CI_PROJECT_DIR/frontend" --dockerfile "$CI_PROJECT_DIR/frontend/Dockerfile" --build-arg GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" --build-arg API_BASE_URL="" --destination "$FRONTEND_IMAGE:$CI_PIPELINE_ID" --destination "$FRONTEND_IMAGE:latest"

# Deploy the current pipeline images into the Kubernetes namespace
deploy_production:
  stage: deploy
  image: bitnami/kubectl:latest
  needs:
    - package_backend
    - package_frontend
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - test -n "$K8S_NAMESPACE"
    - test -n "$K8S_HOST"
    - test -n "$JWT_SECRET"
    - test -n "$POSTGRES_DB"
    - test -n "$POSTGRES_USER"
    - test -n "$POSTGRES_PASSWORD"
    - export CONNECTION_STRING="Host=paytrack-postgres;Port=5432;Database=$POSTGRES_DB;Username=$POSTGRES_USER;Password=$POSTGRES_PASSWORD"
    - kubectl create secret generic paytrack-secrets --namespace "$K8S_NAMESPACE" --from-literal=POSTGRES_DB="$POSTGRES_DB" --from-literal=POSTGRES_USER="$POSTGRES_USER" --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" --from-literal=JWT__Secret="$JWT_SECRET" --from-literal=ConnectionStrings__Default="$CONNECTION_STRING" --dry-run=client -o yaml | kubectl apply -f -
    - sed -e "s|__NAMESPACE__|$K8S_NAMESPACE|g" -e "s|__HOST__|$K8S_HOST|g" -e "s|__BACKEND_IMAGE__|$BACKEND_IMAGE:$CI_PIPELINE_ID|g" -e "s|__FRONTEND_IMAGE__|$FRONTEND_IMAGE:$CI_PIPELINE_ID|g" -e "s|__POSTGRES_IMAGE__|$POSTGRES_IMAGE|g" k8s/deployment.yaml | kubectl apply -f -
    - kubectl rollout status deployment/paytrack-postgres --namespace "$K8S_NAMESPACE" --timeout=180s
    - kubectl rollout status deployment/paytrack-backend --namespace "$K8S_NAMESPACE" --timeout=180s
    - kubectl rollout status deployment/paytrack-frontend --namespace "$K8S_NAMESPACE" --timeout=180s
